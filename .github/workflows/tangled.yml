  pull-requests: read

jobs:
  tangle:
    runs-on: ubuntu-latest
    steps:
      - uses: gwennlbh/to-tangled@50f70a6910307e6fffa632e6d7cfec6b9e9f94ec
        with:
          repo: ankddev.fyi/website
          ssh-key: ${{ secrets.TANGLED_KEY }}
